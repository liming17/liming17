<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Liming Liu — Reliable Agentic Systems</title><desc id="desc">Independent research in agent reliability, evaluation, and capability composition. Based in Vancouver, Canada.</desc>
